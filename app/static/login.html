<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden · Kontoauszug zu CSV</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="login-page">
  <form class="login-card" method="post" action="/login">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h6"/></svg>
    </div>
    <h1>Kontoauszug → CSV</h1>
    <p class="sub">Melde dich mit dem Team-Passwort an.</p>

    <div class="alert" id="err" role="alert" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      Das Passwort ist nicht korrekt.
    </div>

    <div class="field">
      <label for="pw">Passwort</label>
      <div class="input-wrap">
        <input class="input" id="pw" type="password" name="password" autofocus required autocomplete="current-password">
        <button type="button" class="icon-btn" id="toggle" aria-label="Passwort anzeigen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button class="btn" type="submit" id="submit">Anmelden</button>

    <div class="login-foot">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Hochgeladene Auszüge werden nur zur Umwandlung verarbeitet und nicht gespeichert.</span>
    </div>
  </form>
</main>
<script>
const pw = document.getElementById("pw");
if (new URLSearchParams(location.search).has("fehler")) document.getElementById("err").hidden = false;
document.getElementById("toggle").addEventListener("click", e => {
  pw.type = pw.type === "password" ? "text" : "password";
  e.currentTarget.setAttribute("aria-label", pw.type === "password" ? "Passwort anzeigen" : "Passwort verbergen");
  pw.focus();
});
document.querySelector("form").addEventListener("submit", () => {
  const b = document.getElementById("submit"); b.disabled = true; b.textContent = "Anmelden …";
});
</script>
</body>
</html>
